<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="A comic that teaches train, validation and test splits and data leakage to beginners, starring Xiri and Lino.">
<style>html{-webkit-text-size-adjust:100%}body{margin:0}img{max-width:100%}[hidden]{display:none!important}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}</style>
<title>The Data Leak</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bangers&family=Comic+Neue:wght@400;700&family=VT323&display=swap">
<style>
/* Layout: comic pages (white sheets, ink borders, offset shadow) on a navy halftone ground; 6-column panel grid that stacks on phones.
   Single deliberate look (printed comic), so colors are fixed rather than theme-switched. */
:root{
  --ink:#0B1026; --navy:#16245E; --navy2:#22357F; --tint:#DCE4FF;
  --yellow:#FFD23F; --yellow2:#FFE98A; --lemon:#B5E61D; --lemon2:#DDF59A;
  --coral:#FF6B57; --white:#FFFFFF; --line:#FF2E93;
  --disp:'Bangers','Impact','Arial Black',sans-serif;
  --letter:'Comic Neue','Comic Sans MS','Chalkboard SE','Trebuchet MS',sans-serif;
  --lcd:'VT323','Courier New',monospace;
  color-scheme:light;
}
html{background:var(--navy)}
body{
  background-color:var(--navy);
  background-image:radial-gradient(rgba(255,255,255,.08) 1.6px,transparent 1.8px);
  background-size:14px 14px;
  color:var(--ink); font-family:var(--letter); font-size:17px; line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:28px 64px;
}
.book{max-width:940px;margin:0 auto;display:grid;gap:44px}
.page{
  background:var(--white);border:4px solid var(--ink);box-shadow:10px 10px 0 var(--ink);
  padding:14px;display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:12px;
}
.panel{border:4px solid var(--ink);background:var(--white);overflow:hidden;min-width:0}
.panel svg{display:block;width:100%;height:auto}
.s6{grid-column:span 6}.s4{grid-column:span 4}.s3{grid-column:span 3}.s2{grid-column:span 2}
.pgno{grid-column:1/-1;display:flex;justify-content:space-between;font-family:var(--disp);letter-spacing:.06em;font-size:15px;color:var(--navy);margin-top:-2px}
svg text{font-family:var(--letter)}
.lt{font-weight:400;fill:var(--ink)}
.lt .b{font-weight:700;text-decoration:underline;text-decoration-thickness:2px}
.disp{font-family:var(--disp);letter-spacing:.03em}
.nt{font-family:var(--disp);letter-spacing:.05em;fill:var(--navy)}
.lcd{font-family:var(--lcd);fill:var(--lemon)}
.chalk{fill:#F4F7FF}
/* contents strip */
.toc{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:-20px}
.toc a{font-family:var(--disp);letter-spacing:.05em;font-size:18px;color:var(--ink);background:var(--yellow);border:3px solid var(--ink);box-shadow:4px 4px 0 var(--ink);padding:4px 12px;text-decoration:none}
.toc a:hover,.toc a:focus-visible{background:var(--lemon);outline:none;transform:translate(-1px,-1px)}
/* HTML pages: lab, cheat sheet, quiz */
.hpage{background:var(--white);border:4px solid var(--ink);box-shadow:10px 10px 0 var(--ink);padding:22px}
.hpage h2{font-family:var(--disp);font-weight:400;letter-spacing:.04em;font-size:clamp(34px,6vw,52px);line-height:1;margin:0 0 6px;text-wrap:balance}
.hpage .kicker{font-family:var(--disp);letter-spacing:.08em;color:var(--coral);font-size:18px}
.hpage p{max-width:65ch;margin:6px 0 14px}
.lab{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:18px;align-items:start}
.lab svg{width:100%;height:auto;display:block;border:4px solid var(--ink);background:var(--white)}
.knobs{display:grid;gap:14px}
.knob{border:3px solid var(--ink);padding:10px 12px;background:var(--yellow2)}
.knob label{font-family:var(--disp);letter-spacing:.05em;font-size:20px;display:flex;justify-content:space-between}
.knob input{width:100%;accent-color:var(--navy)}
.score{border:3px solid var(--ink);background:var(--navy);color:var(--white);padding:10px 12px;font-family:var(--disp);letter-spacing:.05em;font-size:22px}
.score b{color:var(--yellow);font-weight:400;font-size:34px;font-variant-numeric:tabular-nums}
.score small{display:block;font-family:var(--letter);letter-spacing:0;font-size:15px;color:var(--tint)}
.btns{display:flex;flex-wrap:wrap;gap:8px}
button{font-family:var(--disp);letter-spacing:.05em;font-size:17px;border:3px solid var(--ink);background:var(--white);color:var(--ink);padding:5px 12px;box-shadow:3px 3px 0 var(--ink);cursor:pointer}
button:hover{background:var(--lemon2)}
button:focus-visible,input:focus-visible{outline:3px solid var(--line);outline-offset:2px}
button:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.cheat{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.card{border:3px solid var(--ink);padding:12px 14px;background:var(--white);min-width:0}
.card h3{font-family:var(--disp);font-weight:400;letter-spacing:.05em;font-size:24px;margin:0 0 4px;color:var(--navy)}
.card p{margin:0}
.card.big{grid-column:1/-1;background:var(--yellow)}
.card.warn{background:var(--coral);color:var(--ink)}
.eq{font-family:var(--disp);letter-spacing:.06em;font-size:clamp(34px,7vw,56px);line-height:1}
.eq .ln{color:var(--line)}
.card ul{margin:4px 0 0;padding-left:20px}
.quiz{display:grid;gap:14px}
.q{border:3px solid var(--ink);padding:12px 14px;display:grid;gap:8px;background:var(--tint)}
.q.bonus{background:var(--lemon2)}
.q h3{font-family:var(--disp);font-weight:400;letter-spacing:.05em;font-size:23px;margin:0}
.qrow{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.qrow input{font-family:var(--letter);font-size:18px;width:110px;border:3px solid var(--ink);padding:4px 8px;font-variant-numeric:tabular-nums}
.fb{font-weight:700;min-height:1.4em}
.ans{background:var(--white);border:3px dashed var(--ink);padding:8px 12px;font-variant-numeric:tabular-nums}
.tbc{font-family:var(--disp)}
.swipe{display:none;text-align:center;color:var(--yellow);font-family:var(--disp);letter-spacing:.06em;font-size:17px;margin-top:-28px}
@media (max-width:700px){
  .page{padding:8px;gap:8px;box-shadow:6px 6px 0 var(--ink)}
  .panel{grid-column:span 6}
  .s6{overflow-x:auto;-webkit-overflow-scrolling:touch}
  .s6 svg{min-width:560px}
  .swipe{display:block}
  .lab,.cheat{grid-template-columns:minmax(0,1fr)}
  .hpage{padding:14px;box-shadow:6px 6px 0 var(--ink)}
}
@media (prefers-reduced-motion:no-preference){
  .toc a,button{transition:transform .12s,background .12s}
}
</style>
</head>
<body>


<!-- shared SVG patterns -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <defs>
    <pattern id="dots" width="8" height="8" patternUnits="userSpaceOnUse"><circle cx="4" cy="4" r="1.6" fill="#0B1026" opacity=".28"/></pattern>
    <pattern id="dotsW" width="9" height="9" patternUnits="userSpaceOnUse"><circle cx="4.5" cy="4.5" r="1.7" fill="#FFFFFF" opacity=".22"/></pattern>
    <pattern id="dotsC" width="7" height="7" patternUnits="userSpaceOnUse"><circle cx="3.5" cy="3.5" r="1.5" fill="#FF6B57" opacity=".55"/></pattern>
    <pattern id="ruled" width="20" height="17" patternUnits="userSpaceOnUse"><rect width="20" height="17" fill="#FFFFFF"/><line x1="0" y1="16.5" x2="20" y2="16.5" stroke="#B9C7F5" stroke-width="1"/></pattern>
    <pattern id="hatch" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="10" height="10" fill="#FFE98A"/><line x1="0" y1="0" x2="0" y2="10" stroke="#FF6B57" stroke-width="3"/></pattern>
    <linearGradient id="sunset" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#16245E"/><stop offset=".45" stop-color="#FF6B57"/><stop offset="1" stop-color="#FFD23F"/></linearGradient>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#0B1026"/></marker>
    <marker id="arrC" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#FF6B57"/></marker>
    <marker id="arrW" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#F4F7FF"/></marker>
    <marker id="arrL" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#FF2E93"/></marker>
  </defs>
</svg>

<p style="text-align:center;margin:0 0 -20px"><a href="index.html" style="font-family:var(--disp);letter-spacing:.06em;font-size:18px;color:var(--yellow);text-decoration:none">← ALL COMICS</a></p>
<main class="book" id="book"></main>

<script>
/* ============ palette & data ============ */
const K={ink:'#0B1026',navy:'#16245E',navy2:'#22357F',tint:'#DCE4FF',tint2:'#B9C7F5',yellow:'#FFD23F',yellow2:'#FFE98A',lemon:'#B5E61D',lemon2:'#DDF59A',coral:'#FF6B57',coral2:'#FFC2B8',white:'#FFFFFF',line:'#FF2E93',skin:'#F0CBA8',skin2:'#E8B48A',skin3:'#5E3A22',hair:'#1B1230',chalk:'#F4F7FF',board:'#1C2B66'};
const D=[[18,10],[22,14],[25,24],[28,23],[31,26],[34,22],[37,23],[40,23],[43,20]];
const TR=D;
const GUESS={m:0.5,b:5}, BEST={m:0.95,b:-6.6};
const TOP='#C27A95';
const W={6:800,4:533,3:400,2:267};
let UID=0;

/* ============ text helpers ============ */
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const rich=l=>esc(l===''?' ':l).replace(/\*\*(.+?)\*\*/g,'<tspan class="b">$1</tspan>');
function TX(x,y,s,o={}){
  const size=o.size||15, lh=o.lh||size*1.24, a=o.anchor||'middle';
  const lines=String(s).split('|');
  return `<text x="${x}" y="${y}" font-size="${size}" text-anchor="${a}" class="${o.cls||'lt'}"${o.fill?` fill="${o.fill}"`:''}${o.extra||''}>`+
    lines.map((l,i)=>`<tspan x="${x}" dy="${i?lh:0}">${rich(l)}</tspan>`).join('')+`</text>`;
}
const B=(x,y,s,tx,ty,o={})=>`<g class="bub" data-k="${o.k||'s'}"${tx!=null?` data-tx="${tx}" data-ty="${ty}"`:''}>${TX(x,y,s,{size:o.size||15})}</g>`;
const CAP=(x,y,s,o={})=>`<g class="cap">${TX(x,y,s,{size:o.size||13,anchor:'start'})}</g>`;
const NOTE=(x,y,s,o={})=>{const ts=o.ts||16;return `<g class="note">${TX(x,y,o.title||"LINO'S NOTEBOOK",{size:ts,anchor:'start',cls:'nt'})}${TX(x,y+ts*1.35,s,{size:o.size||13,anchor:'start'})}</g>`};
const SFX=(x,y,s,o={})=>`<text x="${x}" y="${y}" class="disp" font-size="${o.size||30}" text-anchor="middle" fill="${o.fill||K.coral}" stroke="${K.ink}" stroke-width="${o.sw||5}" paint-order="stroke" stroke-linejoin="round" transform="rotate(${o.rot||-8} ${x} ${y})">${esc(s)}</text>`;
const OUT=(x,y,s,o={})=>`<text x="${x}" y="${y}" class="disp" font-size="${o.size||60}" text-anchor="${o.anchor||'middle'}" fill="${o.fill||K.white}" stroke="${K.ink}" stroke-width="${o.sw||8}" paint-order="stroke" stroke-linejoin="round"${o.rot?` transform="rotate(${o.rot} ${x} ${y})"`:''}${o.fit?` data-fit="${o.fit}"`:''}>${esc(s)}</text>`;
const fmt=(v,d=1)=>{const r=Math.round(v*Math.pow(10,d))/Math.pow(10,d);if(Math.abs(r)<1e-9)return '0';return (r<0?'−':'+')+Math.abs(r).toFixed(d)};
const fmtP=(v,d=1)=>{const s=Math.abs(v).toFixed(d);return (v<0?'−':'')+s};

/* ============ scenery ============ */
const R=(x,y,w,h,f,o='')=>`<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="${f}" ${o}/>`;
const bg=(w,h,c,dots=.5)=>R(0,0,w,h,c)+(dots?R(0,0,w,h,'url(#dots)',`opacity="${dots}"`):'');
function sun(x,y,r){let s='';for(let i=0;i<12;i++){const a=i*Math.PI/6;s+=`<line x1="${x+Math.cos(a)*(r+6)}" y1="${y+Math.sin(a)*(r+6)}" x2="${x+Math.cos(a)*(r+18)}" y2="${y+Math.sin(a)*(r+18)}" stroke="${K.ink}" stroke-width="7" stroke-linecap="round"/><line x1="${x+Math.cos(a)*(r+6)}" y1="${y+Math.sin(a)*(r+6)}" x2="${x+Math.cos(a)*(r+18)}" y2="${y+Math.sin(a)*(r+18)}" stroke="${K.yellow}" stroke-width="3.5" stroke-linecap="round"/>`}
  return s+`<circle cx="${x}" cy="${y}" r="${r}" fill="${K.yellow}" stroke="${K.ink}" stroke-width="3.5"/><circle cx="${x+r*.3}" cy="${y+r*.25}" r="${r*.62}" fill="url(#dotsC)" opacity=".55"/>`}
function cloud(x,y,s=1,f=K.white){return `<g transform="translate(${x},${y}) scale(${s})"><path d="M-50,10 Q-62,-12 -36,-16 Q-30,-40 -4,-32 Q12,-50 32,-30 Q60,-30 54,-4 Q66,12 44,16 L-40,16 Q-56,18 -50,10Z" fill="${f}" stroke="${K.ink}" stroke-width="3"/></g>`}
function house(x,y,w,h,c,roof){return R(x,y-h,w,h,c,`stroke="${K.ink}" stroke-width="3"`)+`<path d="M${x-8},${y-h} L${x+w/2},${y-h-w*.45} L${x+w+8},${y-h}Z" fill="${roof}" stroke="${K.ink}" stroke-width="3" stroke-linejoin="round"/>`+R(x+w*.22,y-h*.7,w*.22,h*.24,K.yellow2,`stroke="${K.ink}" stroke-width="2"`)+R(x+w*.58,y-h*.45,w*.22,h*.45,K.navy2,`stroke="${K.ink}" stroke-width="2"`)}
function cup(x,y,s=1,full=true){return `<g transform="translate(${x},${y}) scale(${s})"><path d="M-8,-20 L8,-20 L6,0 L-6,0Z" fill="${K.white}" stroke="${K.ink}" stroke-width="2"/>${full?`<path d="M-7.3,-15 L7.3,-15 L6,0 L-6,0Z" fill="${K.yellow}" stroke="${K.ink}" stroke-width="1.5"/>`:''}</g>`}
function pitcher(x,y,s=1,full=true,rot=0){return `<g transform="translate(${x},${y}) rotate(${rot}) scale(${s})"><path d="M-14,-40 L14,-40 L16,0 L-16,0Z" fill="${K.white}" stroke="${K.ink}" stroke-width="2.5"/>${full?`<path d="M-15,-28 L15,-28 L16,0 L-16,0Z" fill="${K.yellow}"/><circle cx="-4" cy="-14" r="4" fill="${K.lemon}" stroke="${K.ink}" stroke-width="1.2"/>`:''}<path d="M14,-34 Q28,-30 16,-12" fill="none" stroke="${K.ink}" stroke-width="4"/><path d="M-16,0 L16,0" stroke="${K.ink}" stroke-width="2.5"/></g>`}
function stand(x,y,s=1,items=''){
  let aw='';for(let i=0;i<8;i++)aw+=R(-100+i*25,-182,25,26,i%2?K.white:K.yellow,`stroke="${K.ink}" stroke-width="2"`)+`<circle cx="${-87.5+i*25}" cy="-156" r="12.5" fill="${i%2?K.white:K.yellow}" stroke="${K.ink}" stroke-width="2"/>`;
  return `<g transform="translate(${x},${y}) scale(${s})">`+R(-88,-158,7,90,K.white,`stroke="${K.ink}" stroke-width="2.5"`)+R(81,-158,7,90,K.white,`stroke="${K.ink}" stroke-width="2.5"`)+aw+R(-100,-182,200,13,K.coral,`stroke="${K.ink}" stroke-width="2.5"`)+
  R(-96,-76,192,9,K.white,`stroke="${K.ink}" stroke-width="2.5"`)+R(-90,-68,180,68,K.coral,`stroke="${K.ink}" stroke-width="3"`)+R(-90,-68,180,68,'url(#dots)','opacity=".35"')+
  `<text x="0" y="-26" class="disp" font-size="30" text-anchor="middle" fill="${K.yellow}" stroke="${K.ink}" stroke-width="5" paint-order="stroke">LEMONADE</text><text x="0" y="-8" class="disp" font-size="14" text-anchor="middle" fill="${K.white}">FRESH · COLD · 50¢</text>`+items+`</g>`;
}
function person(x,y,s=1,o={}){const c=o.c||K.navy2,sk=o.sk||K.skin2,f=o.flip?-1:1,mood=o.mood||'happy';
  const mouth=mood==='sad'?'M-5,-70 Q0,-75 5,-70':mood==='wow'?'':'M-6,-73 Q0,-66 6,-73';
  return `<g transform="translate(${x},${y}) scale(${f*s},${s})"><path d="M-6,-16 L-7,-2 M6,-16 L7,-2" stroke="${K.ink}" stroke-width="7" stroke-linecap="round"/>`+
  `<path d="M-15,-58 Q0,-64 15,-58 L17,-14 L-17,-14Z" fill="${c}" stroke="${K.ink}" stroke-width="2.5"/>`+(o.reach?`<path d="M14,-52 Q30,-56 38,-62" stroke="${K.ink}" stroke-width="7" stroke-linecap="round" fill="none"/><path d="M14,-52 Q30,-56 38,-62" stroke="${sk}" stroke-width="3.5" stroke-linecap="round" fill="none"/>`:'')+
  `<circle cx="0" cy="-77" r="14" fill="${sk}" stroke="${K.ink}" stroke-width="2.5"/>${o.hat?`<path d="M-15,-82 Q0,-102 15,-82Z" fill="${o.hat}" stroke="${K.ink}" stroke-width="2"/>`:`<path d="M-14,-80 Q-12,-94 0,-93 Q12,-94 14,-80 Q4,-88 -14,-80Z" fill="${o.hair||K.hair}"/>`}`+
  `<circle cx="-5" cy="-78" r="2" fill="${K.ink}"/><circle cx="5" cy="-78" r="2" fill="${K.ink}"/>`+(mood==='wow'?`<ellipse cx="0" cy="-70" rx="3" ry="4" fill="${K.ink}"/>`:`<path d="${mouth}" fill="none" stroke="${K.ink}" stroke-width="2"/>`)+`</g>`}

/* ============ characters ============ */
const ARMS_M={down:['M-21,-80 Q-30,-66 -30,-52','M21,-80 Q30,-66 30,-52'],up:['M-21,-82 Q-34,-98 -38,-118','M21,-82 Q34,-98 38,-118'],
  point:['M-21,-80 Q-30,-66 -30,-52','M21,-82 Q38,-88 56,-94'],hips:['M-21,-80 Q-42,-70 -24,-56','M21,-80 Q42,-70 24,-56'],
  hold:['M-21,-80 Q-28,-62 -12,-62','M21,-80 Q28,-62 12,-62'],wave:['M-21,-80 Q-30,-66 -30,-52','M21,-82 Q42,-96 40,-120'],
  chin:['M-21,-80 Q-30,-66 -30,-52','M21,-80 Q36,-80 12,-98']};
const end=d=>{const n=d.match(/-?\d+(\.\d+)?/g).map(Number);return [n[n.length-2],n[n.length-1]]};
function limb(d,c,w=12){return `<path d="${d}" fill="none" stroke="${K.ink}" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round"/><path d="${d}" fill="none" stroke="${c}" stroke-width="${w-5.5}" stroke-linecap="round" stroke-linejoin="round"/>`}
function maya(x,y,s=1,o={}){
  const m=o.mood||'happy', f=o.flip?-1:1, sk=K.skin, ink=K.ink, arms=ARMS_M[o.arms||'down'];
  let face='';
  const eyes={
    happy:`<path d="M-15,-115 q5,-7 10,0 M5,-115 q5,-7 10,0" fill="none" stroke="${ink}" stroke-width="3" stroke-linecap="round"/>`,
    normal:`<ellipse cx="-10" cy="-117" rx="3.6" ry="5" fill="${ink}"/><ellipse cx="10" cy="-117" rx="3.6" ry="5" fill="${ink}"/>`,
    shocked:`<circle cx="-10" cy="-118" r="6.5" fill="#fff" stroke="${ink}" stroke-width="2"/><circle cx="10" cy="-118" r="6.5" fill="#fff" stroke="${ink}" stroke-width="2"/><circle cx="-10" cy="-118" r="2.6" fill="${ink}"/><circle cx="10" cy="-118" r="2.6" fill="${ink}"/><path d="M-17,-130 q7,-5 13,-2 M4,-132 q7,-3 13,2" stroke="${ink}" stroke-width="2.5" fill="none" stroke-linecap="round"/>`,
    think:`<ellipse cx="-10" cy="-118" rx="3.6" ry="5" fill="${ink}"/><ellipse cx="10" cy="-118" rx="3.6" ry="5" fill="${ink}"/><circle cx="-9" cy="-120" r="1.4" fill="#fff"/><circle cx="11" cy="-120" r="1.4" fill="#fff"/><path d="M4,-130 q7,-6 13,-1" stroke="${ink}" stroke-width="2.5" fill="none" stroke-linecap="round"/>`,
    sad:`<ellipse cx="-10" cy="-116" rx="3.4" ry="4.5" fill="${ink}"/><ellipse cx="10" cy="-116" rx="3.4" ry="4.5" fill="${ink}"/><path d="M-16,-124 L-5,-127 M5,-127 L16,-124" stroke="${ink}" stroke-width="2.5" stroke-linecap="round"/>`,
    det:`<ellipse cx="-10" cy="-116" rx="3.6" ry="4.6" fill="${ink}"/><ellipse cx="10" cy="-116" rx="3.6" ry="4.6" fill="${ink}"/><path d="M-17,-128 L-5,-123 M5,-123 L17,-128" stroke="${ink}" stroke-width="3" stroke-linecap="round"/>`};
  const mouths={happy:`<path d="M-10,-105 Q0,-92 10,-105Z" fill="#7A1F2B" stroke="${ink}" stroke-width="2.2" stroke-linejoin="round"/>`,

function zig(x,ya,yb){const n=Math.max(4,Math.round(Math.abs(yb-ya)/6));let d=`M${x},${ya}`;for(let i=1;i<n;i++){d+=` L${x+(i%2?5:-5)},${ya+(yb-ya)*i/n}`}return d+` L${x},${yb}`}
function chart(o){
  const {x,y,w,h,x0,x1,y0,y1}=o, board=o.theme==='board';
  const sx=v=>x+(v-x0)/(x1-x0)*w, sy=v=>y+h-(v-y0)/(y1-y0)*h;
  const fg=board?K.chalk:K.ink, gc=board?'rgba(244,247,255,.16)':'#E3E9FF', id='cl'+(UID++);
  const pl=o.padL??48,pr=o.padR??20,pt=o.padT??16,pb=o.padB??48;
  let s='';
  if(o.frame!==false){const fx=x-pl,fy=y-pt,fw=w+pl+pr,fh=h+pt+pb;
    s+=board?R(fx-6,fy-6,fw+12,fh+12,K.yellow,`rx="8" stroke="${K.ink}" stroke-width="3"`)+R(fx,fy,fw,fh,K.board,`rx="4" stroke="${K.ink}" stroke-width="2.5"`)+R(fx,fy,fw,fh,'url(#dotsW)','opacity=".35"')
      :R(fx,fy,fw,fh,K.white,`rx="4" stroke="${K.ink}" stroke-width="2.5"`)}
  (o.xt||[]).forEach(v=>{s+=`<line x1="${sx(v)}" y1="${y}" x2="${sx(v)}" y2="${y+h}" stroke="${gc}" stroke-width="1.5"/>`+`<text x="${sx(v)}" y="${y+h+16}" font-size="11.5" text-anchor="middle" fill="${fg}">${fmtP(v,0)}</text>`});
  (o.yt||[]).forEach(v=>{s+=`<line x1="${x}" y1="${sy(v)}" x2="${x+w}" y2="${sy(v)}" stroke="${gc}" stroke-width="1.5"/>`+`<text x="${x-7}" y="${sy(v)+4}" font-size="11.5" text-anchor="end" fill="${fg}">${o.ytf?o.ytf(v):fmtP(v,0)}</text>`});
  if(o.under)s+=o.under(sx,sy);

  (o.lines||[]).forEach(l=>{s+=`<line x1="${sx(x0)}" y1="${sy(l.m*x0+l.b)}" x2="${sx(x1)}" y2="${sy(l.m*x1+l.b)}" stroke="${l.c||K.line}" stroke-width="${l.w||4.5}" stroke-linecap="round"${l.dash?` stroke-dasharray="${l.dash}"`:''} opacity="${l.op??1}"/>`});

const NS='http://www.w3.org/2000/svg';
function el(tag,attrs){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);e.classList.add('deco');return e}
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function bbOf(g){let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;g.querySelectorAll('text').forEach(t=>{const b=t.getBBox();x0=Math.min(x0,b.x);y0=Math.min(y0,b.y);x1=Math.max(x1,b.x+b.width);y1=Math.max(y1,b.y+b.height)});return {x:x0,y:y0,w:x1-x0,h:y1-y0}}
function tailPts(r,tx,ty,hw=9){const cx=r.x+r.w/2,cy=r.y+r.h/2;
  if(ty>r.y+r.h-4&&Math.abs(tx-cx)<r.w/2+60||ty>r.y+r.h+20){const bx=clamp(cx+(tx-cx)*.55,r.x+r.h/2+4,r.x+r.w-r.h/2-4),by=r.y+r.h;return [[bx-hw,by],[bx+hw,by],[tx,ty],0,-1]}
  if(ty<r.y+4&&Math.abs(tx-cx)<r.w/2+60||ty<r.y-20){const bx=clamp(cx+(tx-cx)*.55,r.x+r.h/2+4,r.x+r.w-r.h/2-4),by=r.y;return [[bx-hw,by],[bx+hw,by],[tx,ty],0,1]}
  const bx=tx>cx?r.x+r.w:r.x,by=clamp(ty,r.y+r.h*.3,r.y+r.h*.7);return [[bx,by-hw],[bx,by+hw],[tx,ty],tx>cx?-1:1,0]}
function layout(){
  document.querySelectorAll('.deco').forEach(e=>e.remove());
  document.querySelectorAll('[data-fit]').forEach(t=>{t.removeAttribute('textLength');t.removeAttribute('lengthAdjust');const L=t.getComputedTextLength(),m=+t.dataset.fit;if(L>m){t.setAttribute('textLength',m);t.setAttribute('lengthAdjust','spacingAndGlyphs')}});
  document.querySelectorAll('g.bub').forEach(g=>{
    const b=bbOf(g),k=g.dataset.k,first=g.firstChild;
    const r={x:b.x-13,y:b.y-8,w:b.w+26,h:b.h+16};
    const fill=k==='x'?K.yellow:K.white;
    if(k==='x'){const cx=r.x+r.w/2,cy=r.y+r.h/2,rx=r.w/2+16,ry=r.h/2+14;let pts=[];for(let i=0;i<28;i++){const a=i/28*Math.PI*2,f=i%2?1:.86;pts.push((cx+Math.cos(a)*rx*f).toFixed(1)+','+(cy+Math.sin(a)*ry*f).toFixed(1))}
      if(g.dataset.tx!=null){const t=tailPts({x:cx-rx*.7,y:cy-ry*.75,w:rx*1.4,h:ry*1.5},+g.dataset.tx,+g.dataset.ty,10);g.insertBefore(el('polygon',{points:t.slice(0,3).map(p=>p.join(',')).join(' '),fill,stroke:K.ink,'stroke-width':3,'stroke-linejoin':'round'}),first)}
      g.insertBefore(el('polygon',{points:pts.join(' '),fill,stroke:K.ink,'stroke-width':3,'stroke-linejoin':'round'}),first);return}
    const rx=Math.min(r.h/2,20);
    if(g.dataset.tx!=null){const t=tailPts(r,+g.dataset.tx,+g.dataset.ty);
      g.insertBefore(el('polygon',{points:t.slice(0,3).map(p=>p.join(',')).join(' '),fill,stroke:K.ink,'stroke-width':3,'stroke-linejoin':'round'}),first);
      g.insertBefore(el('rect',{x:r.x,y:r.y,width:r.w,height:r.h,rx,fill,stroke:K.ink,'stroke-width':3}),first);
      const [p1,p2,tip,dx,dy]=t,ins=(p)=>[p[0]+dx*2.6+(p===p1?(dy?1.6:0):(dy?-1.6:0)),p[1]+dy*2.6+(p===p1?(dx?1.6:0):(dx?-1.6:0))];
      const a=ins(p1),c=ins(p2),tp=[tip[0]+(a[0]+c[0]-2*tip[0])*.12,tip[1]+(a[1]+c[1]-2*tip[1])*.12];
      g.insertBefore(el('polygon',{points:[a,c,tp].map(p=>p.join(',')).join(' '),fill}),first);
    } else g.insertBefore(el('rect',{x:r.x,y:r.y,width:r.w,height:r.h,rx,fill,stroke:K.ink,'stroke-width':3}),first);
  });
  document.querySelectorAll('g.cap').forEach(g=>{const b=bbOf(g),r={x:b.x-9,y:b.y-6,w:b.w+18,h:b.h+12},first=g.firstChild;
    g.insertBefore(el('rect',{x:r.x+4,y:r.y+4,width:r.w,height:r.h,fill:K.ink}),first);
    g.insertBefore(el('rect',{x:r.x,y:r.y,width:r.w,height:r.h,fill:K.yellow,stroke:K.ink,'stroke-width':2.5}),first)});
  document.querySelectorAll('g.note').forEach(g=>{const b=bbOf(g),r={x:b.x-22,y:b.y-16,w:b.w+36,h:b.h+24},first=g.firstChild;

    g.insertBefore(el('rect',{x:r.x,y:r.y,width:r.w,height:r.h,fill:'url(#ruled)',stroke:K.ink,'stroke-width':2.5}),first);

}

  box.addEventListener('click',e=>{const b=e.target.closest('button[data-q]');if(!b)return;const i=+b.dataset.q,j=+b.dataset.o,q=Q[i];
    b.parentElement.querySelectorAll('button').forEach(x=>x.classList.remove('right','wrong'));
    b.classList.add(j===q.a?'right':'wrong');document.getElementById('qf'+i).textContent=j===q.a?'Yes! You got it.':'Not quite. Try another one.';
    if(j===q.a)document.getElementById('qa'+i).hidden=false});
})();
</script>
